{% extends "base.html" %}
{% load static %}
{% block content %}

<h1>Delete Task</h1>

<p>Are you sure you want to delete "{{ task.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
</form>

<a href="{% url 'tasks:task-list' %}">
    Cancel
</a>

{% endblock %}
