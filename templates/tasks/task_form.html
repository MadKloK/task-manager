{% extends 'base.html' %}
{% load static %}
{% block content %}

<h1>{{ title }}</h1>

<form method="post">
    {% csrf_token %}

    <div class="card mb-3">
        <div class="card-body">

            {{ form.as_p }}

        </div>
    </div>

    <button type="submit" class="btn btn-primary">
        {{ title }}
    </button>
</form>

{% endblock %}
