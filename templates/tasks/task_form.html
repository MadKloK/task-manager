<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Task</title>
</head>
<body>
    
    <h1>Create Task</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Create Task</button>
    </form>

    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}

</body>
</html>
